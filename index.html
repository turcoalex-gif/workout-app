<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0A0E14">
<meta name="format-detection" content="telephone=no">
<title>Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/BarlowCondensed-SemiBold.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/BarlowCondensed-Bold.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(fonts/IBMPlexMono-Regular.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/IBMPlexMono-SemiBold.woff2) format('woff2')}
:root{--bg:#0A0E14;--p1:#111821;--p2:#18212D;--ln:#243142;--tx:#E6EDF3;--mu:#8B98A9;--am:#F2A900;--am2:#3A2C05;--ok:#3FB950;--bad:#F85149;
 --h:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
 --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--h);font-weight:600;font-size:19px;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{padding-top:var(--st);overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:rgba(10,14,20,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 16px 8px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;min-height:52px}
header h1{margin:0;font-size:26px;letter-spacing:.06em;text-transform:uppercase;flex:1}
header .sub{font-family:var(--m);font-size:13px;color:var(--mu);font-weight:400}
main{padding:12px 14px calc(150px + var(--sb))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0D131B;border-top:1px solid var(--ln);padding-bottom:var(--sb)}
nav#tabs button{flex:1;background:none;border:0;color:var(--mu);font-family:var(--h);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:9px 0 10px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav#tabs button.on{color:var(--am)}
h2{font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:18px 2px 8px;color:var(--tx)}
h3{font-size:19px;margin:0;letter-spacing:.03em}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.card.done{border-color:#5a4505}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mono{font-family:var(--m);font-weight:400}
.mu{color:var(--mu)}
.am{color:var(--am)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.why{font-family:var(--m);font-weight:400;font-size:13px;line-height:1.45;color:#B9C4D0;border-left:3px solid var(--am);padding:4px 0 4px 9px;margin:8px 0 2px}
.rx{font-family:var(--m);font-size:16px;color:var(--am);margin-top:3px}
button,.btn{font-family:var(--h);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);min-height:50px;padding:0 16px;cursor:pointer}
button:active{transform:scale(.98)}
.btn-am{background:var(--am);border-color:var(--am);color:#0A0E14}
.btn-big{width:100%;min-height:62px;font-size:24px;margin:8px 0}
.btn-ghost{background:none}
.btn-sm{min-height:44px;font-size:16px;padding:0 12px}
.btn-bad{color:var(--bad);border-color:#5b2323}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{min-height:48px;min-width:56px;padding:0 14px;border-radius:24px;background:var(--p2);border:1px solid var(--ln);font-size:19px;text-transform:none;letter-spacing:.02em}
.chip.on{background:var(--am);color:#0A0E14;border-color:var(--am)}
label.lb{display:block;font-size:14px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin:12px 2px 4px}
input,select,textarea{font-family:var(--m);font-size:18px;background:#0B1119;color:var(--tx);border:1px solid var(--ln);border-radius:10px;min-height:48px;padding:0 10px;width:100%}
textarea{padding:10px;min-height:80px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--am);outline-offset:0}
input[type=checkbox]{width:28px;height:28px;min-height:0;accent-color:var(--am)}
.set{display:grid;grid-template-columns:30px 1fr 1fr 64px 60px;gap:7px;align-items:center;margin:7px 0}
.set.bw{grid-template-columns:30px 1fr 64px 60px}
.set.hold{grid-template-columns:30px 1fr 58px 60px}
.set .n{font-family:var(--m);color:var(--mu);text-align:center;font-size:16px}
.set input{text-align:center;padding:0 4px;font-size:20px}
.set .x{font-size:11px;color:var(--mu);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:-4px}
.tick{min-height:52px;padding:0;font-size:26px;border-radius:12px}
.set.done .tick{background:var(--am);border-color:var(--am);color:#0A0E14}
.set.done input{border-color:#5a4505;color:var(--am)}
.colhd{display:grid;grid-template-columns:30px 1fr 1fr 64px 60px;gap:7px;font-size:12px;color:var(--mu);letter-spacing:.08em;text-align:center;text-transform:uppercase}
.colhd.bw{grid-template-columns:30px 1fr 64px 60px}.colhd.hold{grid-template-columns:30px 1fr 58px 60px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:32px;color:var(--am);line-height:1.05}
.kpi span{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--p2);border-radius:12px;padding:4px;gap:4px;margin:4px 0 8px;border:1px solid var(--ln)}
.seg button{flex:1;min-height:44px;border:0;background:none;font-size:17px;padding:0 4px;color:var(--mu)}
.seg button.on{background:var(--am);color:#0A0E14}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--ln);min-height:56px}
.pill{display:inline-block;font-family:var(--m);font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:2px 8px;color:var(--mu);margin:2px 4px 2px 0;font-weight:400}
.pill.am{border-color:#5a4505;color:var(--am)}
#timer{position:fixed;left:10px;right:10px;bottom:calc(68px + var(--sb));z-index:7;background:var(--am);color:#0A0E14;border-radius:16px;display:none;align-items:center;gap:8px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#timer.show{display:flex}
#timer .t{font-family:var(--m);font-weight:600;font-size:34px;flex:1}
#timer .lbl{font-size:13px;letter-spacing:.1em}
#timer button{background:#0A0E14;color:var(--am);border:0;min-height:50px;font-size:18px;padding:0 12px}
#timer.zero{animation:flash .5s 6 alternate}
@keyframes flash{to{background:#fff}}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet.show{display:flex}
#sheet .panel{background:var(--p1);border-top:1px solid var(--ln);border-radius:18px 18px 0 0;width:100%;max-height:88vh;overflow:auto;padding:14px 16px calc(24px + var(--sb));-webkit-overflow-scrolling:touch}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
#toast{position:fixed;pointer-events:none;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));z-index:30;background:var(--p2);border:1px solid var(--am);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:17px;display:none;max-width:90vw;text-align:center}
#holdov{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
#holdov.show{display:flex}
#holdov .big{font-family:var(--m);font-size:96px;color:var(--am)}
pre.report{white-space:pre-wrap;font-family:var(--m);font-size:12.5px;font-weight:400;line-height:1.45;background:#0B1119;border:1px solid var(--ln);border-radius:10px;padding:10px;max-height:55vh;overflow:auto}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--m);font-size:11px;fill:var(--mu)}
.banner{background:var(--am2);border:1px solid #5a4505;color:var(--am);border-radius:12px;padding:10px 12px;font-size:16px;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-family:var(--m);font-weight:400;font-size:13px}
.tbl td,.tbl th{border-bottom:1px solid var(--ln);padding:7px 4px;text-align:left;vertical-align:top}
.tbl td:last-child,.tbl th:last-child{white-space:nowrap}
.tbl th{color:var(--mu);font-weight:400;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.bar{height:16px;background:var(--am);border-radius:4px}
.drill{display:flex;justify-content:space-between;font-family:var(--m);font-weight:400;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--ln)}
.hide{display:none!important}
a{color:var(--am)}
</style>
</head>
<body>
<header><h1 id="title">Workout</h1><span class="sub" id="hdrsub"></span></header>
<main id="view"><p class="mono mu">Loading…</p></main>
<div id="timer"><div class="grow"><div class="lbl">REST</div><div class="t" id="tleft">0:00</div></div><button data-a="timerAdd" data-v="-15">−15</button><button data-a="timerAdd" data-v="15">+15</button><button data-a="timerSkip">Skip</button></div>
<div id="holdov"><div class="mu" id="holdname" style="font-size:22px"></div><div class="big" id="holdt">0:00</div><div class="mono mu" id="holdtgt"></div><button class="btn-am btn-big" data-a="holdStop" style="max-width:340px">Done / Stop</button><button class="btn-ghost" data-a="holdCancel">Cancel</button></div>
<div id="sheet"><div class="panel" id="sheetp"></div></div>
<div id="toast"></div>
<nav id="tabs">
 <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><path d="M3 12h3m12 0h3M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>Today</button>
 <button data-a="tab" data-v="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>Log</button>
 <button data-a="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
 <button data-a="tab" data-v="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</button>
 <button data-a="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" class="hide">
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
